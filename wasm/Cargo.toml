[package]
name = "sphere-overburden-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Sphere Overburden Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WebAssembly bindings for Rust
wasm-bindgen = "0.2"

# JSON serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Linear algebra library for vector operations
# Enable serde feature for serialization support
nalgebra = { version = "0.33", features = ["serde-serialize"] }


[profile.release]
# Optimize for small code size for faster web loading
opt-level = "s"
lto = true
