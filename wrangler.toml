# Cloudflare Pages Configuration
#
# This file configures deployment settings for Cloudflare Pages.
# It is optional but provides explicit control over build settings.

name = "sphere-overburden-em-simulator"
compatibility_date = "2024-01-01"

# Pages configuration
[site]
bucket = "./dist"

# Build configuration
[build]
command = "./build.sh"
cwd = "."
watch_dirs = ["wasm/src", "frontend"]

[build.upload]
format = "directory"
dir = "./dist"

# Environment variables (if needed)
# [env.production]
# API_KEY = "your-key-here"
